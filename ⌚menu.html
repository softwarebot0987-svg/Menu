<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--lime:#b4ee4c;--pink:#f3a39e;--aqua:#6fd0dc;--sand:#e6dcc3;--bg:#f1f1ef;--card:#fff;--ink:#0c0c0c;--mut:#6d6d68;--line:#dcdcd6;--f:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--card:#1d1d1c;--ink:#f4f4f0;--mut:#9a9a93;--line:#333}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--f);padding-bottom:110px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0}:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{max-width:720px;margin:auto;padding:16px}
h1{font-size:clamp(40px,11vw,64px);line-height:.92;letter-spacing:-.05em;font-weight:800;margin:6px 0 10px}h2{font-size:24px;letter-spacing:-.04em;font-weight:800;margin:0 0 10px}
.pill{display:inline-block;border-radius:999px;padding:7px 14px;background:var(--lime);color:#0c0c0c;font-weight:700;font-size:13px}
input,select,textarea{width:100%;padding:13px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink)}textarea{border-radius:22px;resize:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0;position:sticky;top:0;z-index:5;background:var(--bg);scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border-radius:999px;padding:10px 18px;background:var(--card);border:1px solid var(--line);font-weight:600}.chips .on{background:#0c0c0c;color:#fff;border-color:#0c0c0c}
.dish{display:flex;gap:14px;background:var(--card);border-radius:28px;padding:12px;margin-bottom:12px;align-items:center}
.ph{width:92px;height:92px;border-radius:22px;object-fit:cover;flex:none;display:grid;place-items:center;font-size:34px;font-weight:800;color:#0c0c0c}
.dish h3{margin:0;font-size:18px;letter-spacing:-.03em;line-height:1.1}.dish p{margin:3px 0 8px;color:var(--mut);font-size:13px}.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{border-radius:999px;padding:11px 22px;background:#0c0c0c;color:#fff;font-weight:700}.btn.l{background:var(--lime);color:#0c0c0c}.btn.o{background:transparent;color:inherit;border:1.5px solid currentColor}.btn[disabled]{opacity:.5}
.step{display:flex;align-items:center;gap:10px}.step button{width:36px;height:36px;border-radius:50%;background:#0c0c0c;color:#fff;font-size:20px;font-weight:700}.step b{min-width:20px;text-align:center}
.sold{opacity:.55}.tag{border-radius:999px;background:var(--pink);color:#0c0c0c;padding:4px 12px;font-size:12px;font-weight:700}
#bar{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:688px;margin:auto;background:#0c0c0c;color:#fff;border-radius:999px;padding:8px 8px 8px 24px;display:none;align-items:center;justify-content:space-between;z-index:8}#bar.on{display:flex}
#sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:20}#sheet.on{display:flex}
.sh{background:var(--sand);color:#0c0c0c;border-radius:32px 32px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));width:min(720px,100%);max-height:92vh;overflow:auto;animation:up .35s cubic-bezier(.22,1,.36,1)}@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh label{display:block;font-size:12px;font-weight:700;margin:12px 0 5px}.sh input,.sh select,.sh textarea{background:#fff;border:0;color:#0c0c0c}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #0c0c0c22}
.done{text-align:center;padding:40px 10px}.done .ok{width:92px;height:92px;border-radius:50%;background:var(--lime);display:grid;place-items:center;font-size:46px;margin:0 auto 18px;color:#0c0c0c}
.msg{padding:34px;text-align:center;color:var(--mut);background:var(--card);border-radius:26px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="wrap"><div class="row"><span class="pill" id="tbl" hidden></span></div><h1 id="name">Menu</h1>
<input id="q" type="search" placeholder="Search dishes…" aria-label="Search dishes" hidden><div class="chips" id="chips" hidden></div><div id="list"><div class="msg">Loading menu…</div></div></div>
<div id="bar"><span><b id="bN">0 items</b> · <b id="bT">₹0</b></span><button class="btn l" id="bGo">View order</button></div>
<div id="sheet"><div class="sh" id="sh"></div></div>
<!--
 FIRESTORE RULES to allow this page (merge into your existing rules):
 match /cafes/{uid}/public/menu { allow read: if true; allow write: if request.auth != null && request.auth.uid == uid; }
 match /cafes/{uid}/inbox/{id} {
   allow create: if request.resource.data.keys().hasOnly(['lines','total','table','name','phone','note','status','createdAt'])
     && request.resource.data.status == 'new' && request.resource.data.lines is list
     && request.resource.data.lines.size() > 0 && request.resource.data.lines.size() <= 40
     && request.resource.data.total is number && request.resource.data.total < 100000
     && request.resource.data.name.size() <= 80 && request.resource.data.phone.size() <= 80 && request.resource.data.note.size() <= 200;
   allow read, update, delete: if request.auth != null && request.auth.uid == uid;
 }
-->
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import{getFirestore,doc,getDoc,collection,addDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDUFN7I20JFpZBUBEK9gaftN44DQSD1JOQ",authDomain:"cafe-f51f5.firebaseapp.com",projectId:"cafe-f51f5",storageBucket:"cafe-f51f5.firebasestorage.app",messagingSenderId:"712866884490",appId:"1:712866884490:web:d2d02fb150c41f302cb673",measurementId:"G-83D09P3RG9"};
const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=new URLSearchParams(location.search),C=P.get('c'),T=parseInt(P.get('t'),10),TABLE=T>0?'Table '+String(T).padStart(2,'0'):'';
const COL=['var(--lime)','var(--aqua)','var(--pink)','var(--sand)'],inr=n=>'₹'+Number(n).toLocaleString('en-IN');
let M={name:'',items:[]},cart={},cat='All',sending=false;
if(TABLE){$('tbl').hidden=false;$('tbl').textContent=TABLE}
const lines=()=>M.items.filter(i=>cart[i.id]>0&&!i.off).map(i=>({id:i.id,name:i.name,qty:cart[i.id],price:i.price})),total=()=>lines().reduce((a,l)=>a+l.price*l.qty,0),count=()=>lines().reduce((a,l)=>a+l.qty,0);
function msg(t){$('list').innerHTML='<div class="msg">'+t+'</div>'}
async function load(){if(!C)return msg('This menu link is incomplete. Please scan the table QR code again.');
try{const s=await getDoc(doc(getFirestore(initializeApp(firebaseConfig)),'cafes',C,'public','menu'));if(!s.exists())return msg('The menu is not available yet. Please ask the staff.');M=s.data();M.items=Array.isArray(M.items)?M.items:[];
$('name').textContent=M.name||'Menu';document.title=(M.name||'Menu')+' | Order';draw()}catch(e){msg(/permission/i.test(String(e&&e.message))?'The menu is not open to customers yet. Please ask the staff.':'Could not load the menu. Check your internet and refresh.')}}
function draw(){const cats=['All',...new Set(M.items.map(i=>i.cat||'Food'))];$('q').hidden=$('chips').hidden=!M.items.length;
$('chips').innerHTML=cats.map(c=>`<button class="${c===cat?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
const q=$('q').value.trim().toLowerCase(),L=M.items.filter(i=>(cat==='All'||(i.cat||'Food')===cat)&&(i.name+' '+(i.desc||'')).toLowerCase().includes(q));
$('list').innerHTML=L.map((i,k)=>{const n=cart[i.id]||0;return `<div class="dish ${i.off?'sold':''}">${i.photo?`<img class="ph" src="${esc(i.photo)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=ph style=background:${COL[k%4]}>${esc(i.name[0]||'')}</div>'">`:`<div class="ph" style="background:${COL[k%4]}">${esc(i.name[0]||'')}</div>`}<div class="grow"><h3>${esc(i.name)}</h3>${i.desc?`<p>${esc(i.desc)}</p>`:'<p></p>'}<div class="row"><b style="font-size:19px">${inr(i.price)}</b>${i.off?'<span class="tag">Sold out</span>':n?`<div class="step"><button data-m="${i.id}" aria-label="Remove one">−</button><b>${n}</b><button data-p="${i.id}" aria-label="Add one">+</button></div>`:`<button class="btn l" data-p="${i.id}">Add</button>`}</div></div></div>`}).join('')||'<div class="msg">No dishes found.</div>';
const c=count();$('bar').classList.toggle('on',c>0&&!$('sheet').classList.contains('on'));$('bN').textContent=c+(c===1?' item':' items');$('bT').textContent=inr(total())}
$('chips').onclick=e=>{const b=e.target.closest('[data-c]');if(b){cat=b.dataset.c;draw()}};$('q').oninput=draw;
$('list').onclick=e=>{const p=e.target.closest('[data-p]'),m=e.target.closest('[data-m]');if(p)cart[p.dataset.p]=Math.min(99,(cart[p.dataset.p]||0)+1);else if(m)cart[m.dataset.m]=Math.max(0,(cart[m.dataset.m]||0)-1);else return;draw()};
function open(h){$('sh').innerHTML=h;$('sheet').classList.add('on');$('bar').classList.remove('on')}
function close(){$('sheet').classList.remove('on');draw()}$('sheet').onclick=e=>{if(e.target.id==='sheet')close()};
function cartView(){const L=lines();if(!L.length)return close();
open(`<h2>Your order</h2>${L.map(l=>`<div class="line"><span><b>${esc(l.name)}</b><br>${inr(l.price)} each</span><div class="step"><button data-m="${l.id}" aria-label="Remove one">−</button><b>${l.qty}</b><button data-p="${l.id}" aria-label="Add one">+</button></div></div>`).join('')}
<div class="row" style="margin:14px 0 4px"><b>Total</b><b style="font-size:26px">${inr(total())}</b></div>
${TABLE?'':`<label for="oT">Table</label><select id="oT"><option>Takeaway</option>${Array.from({length:20},(_,i)=>`<option>Table ${String(i+1).padStart(2,'0')}</option>`).join('')}</select>`}
<label for="oN">Your name (optional)</label><input id="oN" maxlength="60"><label for="oP">Phone (optional)</label><input id="oP" type="tel" maxlength="20"><label for="oNote">Note for the kitchen (optional)</label><textarea id="oNote" rows="2" maxlength="150" placeholder="Less spicy, no onion…"></textarea>
<div class="row" style="margin-top:18px;justify-content:flex-start"><button class="btn" id="oSend">Place order</button><button class="btn o" id="oBack">Back to menu</button></div>`);
$('oBack').onclick=close;$('oSend').onclick=send}
$('bGo').onclick=cartView;
$('sh').onclick=e=>{const p=e.target.closest('[data-p]'),m=e.target.closest('[data-m]');if(!p&&!m)return;if(p)cart[p.dataset.p]=Math.min(99,(cart[p.dataset.p]||0)+1);else cart[m.dataset.m]=Math.max(0,(cart[m.dataset.m]||0)-1);cartView()};
async function send(){if(sending)return;const L=lines();if(!L.length)return;sending=true;const b=$('oSend');b.disabled=true;b.textContent='Sending…';
const v=id=>($(id)?$(id).value:'').trim();
try{await addDoc(collection(getFirestore(initializeApp(firebaseConfig)),'cafes',C,'inbox'),{lines:L,total:total(),table:TABLE||v('oT')||'Takeaway',name:v('oN'),phone:v('oP'),note:v('oNote'),status:'new',createdAt:serverTimestamp()});
const t=total();cart={};open(`<div class="done"><div class="ok">✓</div><h2>Order sent!</h2><p>${L.reduce((a,l)=>a+l.qty,0)} items · ${inr(t)}<br>The staff will confirm it shortly.</p><button class="btn" id="oNew">Order more</button></div>`);$('oNew').onclick=close}
catch(e){b.disabled=false;b.textContent='Place order';alert(/permission/i.test(String(e&&e.message))?'Orders are not switched on yet. Please call the staff.':'Could not send the order. Check your internet and try again.')}sending=false}
load();
</script></body></html>
